   <g id="text_1">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; text-anchor: middle; fill: #1f2933" x="285.8544" y="121.401875" transform="rotate(-0 285.8544 121.401875)">Plain llama.cpp</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(261.663775 182.008937)">建立 Trace</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(211.777056 193.850812)">获得 Router / Task / OS 语义观测</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(221.527837 248.6785)">Router 暴露未来 Expert 需求</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(210.212212 260.677875)">→ Router-driven Expert Prefetch</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(252.684088 328.509131)">严格 5×5 实验</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(237.459869 340.234756)">Prefetch ≠ 自动加速</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(215.732525 407.955856)">Expert Slice → Memory Object</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(188.237994 420.084919)">Demand Lifecycle + Semantic Working Set</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(223.023931 487.728206)">尝试 MADV_COLD 研究策略</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(224.999712 500.209456)">Cold Object ≠ 应立即回收</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(248.17315 567.871337)">Runtime Rescue</text>
    <text style="font-size: 10px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(223.613775 579.713212)">静态策略 → 运行时反馈保护</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(514.233759 306.895397)">转折 1</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(499.9104 317.448459)">不把可预测性</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(504.4104 328.001522)">误当作加速</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(514.233759 473.215397)">转折 2</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(504.4104 483.768459)">不把冷对象</text>
    <text style="font-weight: 700; font-size: 9px; font-family: 'Noto Sans CJK JP'; fill: #1f2933" transform="translate(490.9104 494.321522)">误当作可立即回收</text>
   </g>
   <g id="text_10">
