  <g id="text_32">
   <text style="font-size: 8.6px; font-family: 'Noto Sans CJK JP'; fill: #667085" transform="translate(54.278 357.331738)">N=5×5；tested 7040 MiB cold-cache setup。No stable speedup observed.</text>
   <text style="font-size: 8.6px; font-family: 'Noto Sans CJK JP'; fill: #667085" transform="translate(54.278 368.064)">两图为独立坐标轴；不使用双 Y 轴，也不把 major-fault 微小变化解释为加速。</text>
